{% extends "base.html" %}{% block title %}Sign up · Donkey Ledger{% endblock %}{% block content %}
<div class="page-header"><div><div class="eyebrow accent">JOIN THE TABLE</div><h1>Know <em>your edge.</em></h1></div></div><section class="panel form-panel auth-panel"><form method="post">{% csrf_token %}
{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<small class="red">{{ error }}</small>{% endfor %}</div>{% endfor %}
<button class="btn btn-primary">Create account →</button><p class="muted">Already a member? <a class="link" href="{% url 'login' %}">Sign in</a></p></form></section>{% endblock %}
